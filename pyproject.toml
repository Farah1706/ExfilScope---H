[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "exfilscope"
version = "0.1.0"
description = "Privacy-minimized cross-plane verification in a controlled laboratory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.3",
  "httpx==0.28.1",
  "rfc8785==0.1.4",
  "mitmproxy==12.2.3",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "hatchling==1.27.0", "editables==0.5"]

[project.scripts]
exfilscope = "exfilscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: actual HTTP/HTTPS through a separate mitmdump process"]

[tool.ruff]
target-version = "py313"
line-length = 100
